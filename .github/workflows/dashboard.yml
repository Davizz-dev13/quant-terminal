name: Actualizar dashboard

on:
  schedule:
    # 21:30 UTC, de lunes a viernes: despues del cierre de EE.UU. todo el año
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance pyarrow pyyaml
      - run: python scripts/generate_dashboard.py
      - run: python scripts/walk_forward.py
      - run: python scripts/generate_mag7w.py
      - name: Commit datos del dashboard si hay cambios
        run: |
          git config user.name "Davizz-dev13"
          git config user.email "Davizz-dev13@users.noreply.github.com"
          git add docs/data.json docs/walkforward.json docs/mag7/mag7.json
          git diff --cached --quiet || git commit -m "Datos del dashboard: $(date -u +%Y-%m-%d)"
          git push
